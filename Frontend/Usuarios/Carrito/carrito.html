        <div id="formulario" class="row text-center rounded py-3">
            <div class="col" id="seccion-juegos">
                <h2 class="text-white">Juegos en el carrito</h2>
                <p class="m-5" id="alerta-sin-juegos">No hay juegos actualmente en el carrito</p>
                <div class="card m-4" id="contenedor-juegos-seleccionados">
                    <ul class="list-group list-group-flush" id="juegos">
                    </ul>
                </div>
            </div>
            <div class="col-lg-5 ps-4 pe-4 text-white position-relative" id="seccion-compra">
                <h2>Metodo de pago</h2>
                <div class="position-absolute top-50 start-50 translate-middle">
                    <label for="tarjeta">Numero de tarjeta</label>
                    <div class="InputContainer mb-2 mb-3" id="contenedor-input">
                        <input placeholder="0000 0000 0000 0000" id="numero-tarjeta" class="tarjeta" name="text" type="text" maxlength="19">
                        <div class="visaCard">
                            <svg viewBox="0 0 48 48" height="23" width="23" y="0px" x="0px"
                                xmlns="http://www.w3.org/2000/svg" class="logo">

                                    fill="#ff3d00"></path>
                            </svg>
                        </div>
                    </div>
                    <label for="fecha" class="w-100">Fecha de caducidad</label>
                    <input type="datetime" id="fecha" class="rounded mb-3" placeholder="MM/YY" style="width: 5.5cap;" maxlength="5">
                    <label for="codigo" class="w-100">CVV - CVC</label>
                    <input type="number" id="codigo" class="rounded mb-3" placeholder="####" style="width: 4.1cap;" >
                    <label for="nombre" class="w-100">Nombre del propetario</label>
                    <input type="text" id="nombre" class="rounded mb-3">
                    <button class="btn-pagar w-100 mt-3" id="pagar">
                        Realizar compra
                        <svg class="svgIcon" viewBox="0 0 576 512">
